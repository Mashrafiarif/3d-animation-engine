<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Three.js V3 — Planted Steps and Physical Pickup</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1018}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';

// Completely deterministic: the GitHub renderer calls renderAt(timestamp) for every frame.
const q=new URLSearchParams(location.search);
const W=Math.max(160,Number(q.get('w'))||540),H=Math.max(160,Number(q.get('h'))||960);
const portrait=H>W;
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'low-power'});
R.setPixelRatio(1);R.setSize(W,H,false);
R.outputColorSpace=THREE.SRGBColorSpace;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.24;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#0b1018');scene.fog=new THREE.FogExp2('#0b1018',.021);
const camera=new THREE.PerspectiveCamera(portrait?41:38,W/H,.1,60);
const v=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp=(x)=>Math.min(1,Math.max(0,x));
const ease=(a,b,t)=>{const u=clamp((t-a)/(b-a));return u*u*(3-2*u)};
const mix=(a,b,u)=>a+(b-a)*u;
const mv=(a,b,u)=>a.clone().lerp(b,u);
const mat=(color,rough=.46,metal=.05,extra={})=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,...extra});
const shell=mat('#f4f8fb',.27,.12),shade=mat('#becbd5',.44,.08),dark=mat('#111b2a',.30,.15),
  navy=mat('#202742',.42,.16),mint=mat('#c6ff00',.33,.06,{emissive:'#3d6100',emissiveIntensity:.16}),
  crystalMat=mat('#d9ff76',.19,.12,{emissive:'#9bf000',emissiveIntensity:1.35}),
  coral=mat('#e9a4a8',.7,0),plinth=mat('#344257',.51,.23);
const lightEye=new THREE.MeshStandardMaterial({color:'#bfff67',emissive:'#a0ff16',emissiveIntensity:1.5,roughness:.3});
function mesh(parent,geo,m,x=0,y=0,z=0,cast=true){
 const a=new THREE.Mesh(geo,m);a.position.set(x,y,z);a.castShadow=cast;a.receiveShadow=true;parent.add(a);return a;
}
const sphere=(r,w=24,h=16)=>new THREE.SphereGeometry(r,w,h);
const axis=v(0,1,0);
function between(obj,a,b){const delta=b.clone().sub(a),len=Math.max(.00001,delta.length());
  obj.position.copy(a).add(b).multiplyScalar(.5);obj.quaternion.setFromUnitVectors(axis,delta.clone().multiplyScalar(1/len));obj.scale.y=len;
}
function capsulePart(parent,r,m){return mesh(parent,new THREE.CylinderGeometry(r,r,1,16),m);}
// Lighting and physical floor: clean product-animation look rather than random particles.
scene.add(new THREE.HemisphereLight(0xc9e9ff,0x28334c,2.2));
const sun=new THREE.DirectionalLight('#ffffff',2.8);sun.position.set(-3.4,7,4.8);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-5;sun.shadow.camera.right=5;
sun.shadow.camera.top=5;sun.shadow.camera.bottom=-5;sun.shadow.normalBias=.035;sun.shadow.bias=-.00008;
scene.add(sun);
const rim=new THREE.DirectionalLight('#99d9ff',1.55);rim.position.set(3.5,4,-3.0);scene.add(rim);
const edge=new THREE.PointLight('#a0ff54',1.6,5);edge.position.set(2.2,2.1,1.7);scene.add(edge);
const ground=mesh(scene,new THREE.PlaneGeometry(100,100),mat('#111826',.82,.04),0,-.075,0,false);ground.rotation.x=-Math.PI/2;
const stage=mesh(scene,new THREE.CylinderGeometry(2.8,2.88,.17,64),mat('#222e42',.53,.18),-.26,.00,0,false);
const trim=mesh(scene,new THREE.TorusGeometry(2.54,.019,6,76),new THREE.MeshBasicMaterial({color:'#8fc267'}),-.26,.094,0,false);trim.rotation.x=Math.PI/2;
// Subtle environment depth cues, far behind the character.
for(const x of [-2.55,2.05]){
 mesh(scene,new THREE.BoxGeometry(.055,3.15,.055),mat('#53637b',.62,.13),x,1.48,-2.30,false);
 mesh(scene,new THREE.BoxGeometry(.018,2.95,.018),new THREE.MeshBasicMaterial({color:x<0?'#577b9d':'#85a654'}),x,1.48,-2.25,false);
}
const standX=.83,standZ=.12;
mesh(scene,new THREE.CylinderGeometry(.34,.40,.70,32),plinth,standX,.45,standZ);
mesh(scene,new THREE.CylinderGeometry(.39,.39,.065,32),navy,standX,.835,standZ);
const orbStand=v(standX,1.14,standZ);
const ring=mesh(scene,new THREE.TorusGeometry(.31,.012,5,48),mint,standX,.876,standZ,false);ring.rotation.x=Math.PI/2;
// Character is made of true meshes. No sprites or flat overlays.
const hero=new THREE.Group();scene.add(hero);
const body=mesh(hero,new THREE.CapsuleGeometry(.325,.49,5,26),shell,0,1.20,0);
const belly=mesh(hero,new THREE.SphereGeometry(.32,24,16),shade,0,.97,-.06);belly.scale.set(1,.65,.87);
const chest=mesh(hero,new THREE.CylinderGeometry(.145,.145,.027,32),navy,0,1.28,.342);chest.rotation.x=Math.PI/2;
const chestGlow=mesh(hero,new THREE.CylinderGeometry(.098,.098,.03,32),mint,0,1.28,.36);chestGlow.rotation.x=Math.PI/2;
const neck=mesh(hero,new THREE.CylinderGeometry(.115,.125,.22,16),shade,0,1.70,0);
const head=new THREE.Group();head.position.set(0,1.98,.03);hero.add(head);
mesh(head,sphere(.43,32,24),shell);
const visor=mesh(head,sphere(.35,32,20),dark,0,.015,.244);visor.scale.set(1,.67,.47);
const eyes=[],brows=[];
for(const side of [-1,1]){
 const eye=mesh(head,sphere(.070,16,12),lightEye,side*.167,.046,.394);eyes.push(eye);
 const br=mesh(head,new THREE.CapsuleGeometry(.021,.11,3,9),mint,side*.165,.196,.389);
 br.rotation.z=side*.17;brows.push(br);
 const blush=mesh(head,sphere(.036,12,8),coral,side*.31,-.105,.33);blush.scale.set(1,.56,.55);
}
const smile=mesh(head,new THREE.TorusGeometry(.074,.012,6,26,Math.PI),mint,0,-.135,.408);smile.rotation.z=Math.PI;
const oh=mesh(head,new THREE.TorusGeometry(.045,.013,6,22),mint,0,-.130,.410);oh.visible=false;
mesh(head,new THREE.CylinderGeometry(.028,.042,.13,10),shell,0,.46,0);
mesh(head,sphere(.083,14,12),mint,0,.56,0);
// Legs: 2-segment articulated limbs with analytically planted foot targets.
const legs=[];
for(const side of [-1,1]){
 const upper=capsulePart(hero,.114,navy),lower=capsulePart(hero,.102,shade);
 const knee=mesh(hero,sphere(.115,14,10),navy),ankle=mesh(hero,sphere(.102,14,10),shade);
 const shoe=mesh(hero,sphere(.16,20,14),mint);shoe.scale.set(1,.65,1.40);
 const hipBall=mesh(hero,sphere(.148,16,12),shell,side*.21,.84,0);
 legs.push({side,upper,lower,knee,ankle,shoe,hipBall});
}
function ikChain(start,target,len1,len2,bendHint){
 const delta=target.clone().sub(start),d0=Math.max(.001,delta.length());
 const d=Math.min(d0,len1+len2-.002),dir=delta.multiplyScalar(1/d0);
 const along=(len1*len1-len2*len2+d*d)/(2*d);
 const hh=Math.sqrt(Math.max(0,len1*len1-along*along));
 const perp=bendHint.clone().addScaledVector(dir,-bendHint.dot(dir));
 if(perp.lengthSq()<.0001)perp.set(0,0,1);perp.normalize();
 return start.clone().addScaledVector(dir,along).addScaledVector(perp,hh);
}
function bodyWorldX(t){return mix(-1.55,-.40,ease(0,1.42,t));}
function footTarget(side,t){
 // Land at these exact times; keep each foot planted until its next swing.
 const initial=side<0?.18:.54,cycle=.72;
 const prev=initial+Math.floor((t-initial)/cycle)*cycle,next=prev+cycle;
 const u=clamp((t-prev)/cycle);
 const at=(when)=>bodyWorldX(when)+side*.21+.21;
 const x0=at(prev),x1=at(next);
 const swing=ease(.55,1,u);
 const lift=swing>0&&swing<1?.145*Math.sin(Math.PI*swing):0;
 const walkFade=1-ease(1.36,1.65,t);
 const z=.17+(side<0?.02:-.02);
 return v(mix(x0,x1,swing)*walkFade+(bodyWorldX(1.42)+side*.21)* (1-walkFade),
          .23+lift*walkFade,z);
}
function poseLeg(L,t){
 const hip=v(L.side*.21,.83,.015);
 const world=footTarget(L.side,t);
 const ankle=world.clone().sub(hero.position).applyAxisAngle(v(0,1,0),-hero.rotation.y);
 const knee=ikChain(hip,ankle,.46,.49,v(0,.05,.9));
 between(L.upper,hip,knee);between(L.lower,knee,ankle);
 L.knee.position.copy(knee);L.ankle.position.copy(ankle);L.shoe.position.copy(ankle);
 L.shoe.rotation.x=.17*(1-ease(1.35,1.6,t))*Math.sin((t-(L.side<0?.18:.54))*8.72);
}
// Arms: two articulated segments, distinct elbow joints, separate palms and fingers.
const arms=[];
for(const side of [-1,1]){
 const upper=capsulePart(hero,.105,shell),lower=capsulePart(hero,.090,shade);
 const elbow=mesh(hero,sphere(.116,16,12),shell),palm=mesh(hero,sphere(.116,16,12),mint);
 const joint=mesh(hero,sphere(.154,18,12),shell,side*.43,1.55,0);
 const fingerGroup=new THREE.Group();hero.add(fingerGroup);
 for(const z of [-.095,.095]){
   const finger=mesh(fingerGroup,new THREE.CapsuleGeometry(.035,.15,3,10),mint,.132,z>0?.070:-.070,z);
   finger.rotation.z=Math.PI/2;
 }
 arms.push({side,upper,lower,elbow,palm,joint,fingerGroup});
}
function poseArm(A,target,grip){
 const sh=v(A.side*.43,1.55,.015),el=ikChain(sh,target,.59,.61,v(A.side*.7,-.18,-.32));
 between(A.upper,sh,el);between(A.lower,el,target);
 A.elbow.position.copy(el);A.palm.position.copy(target);
 A.fingerGroup.position.copy(target);
 A.fingerGroup.scale.setScalar(A.side>0?mix(.50,1,grip):0.5);
}
// Crystal is a distinct world object. It moves ONLY once hand contact is established.
const crystal=new THREE.Group();scene.add(crystal);
mesh(crystal,new THREE.IcosahedronGeometry(.19,1),crystalMat);
const core=mesh(crystal,new THREE.IcosahedronGeometry(.067,0),shell);
const halo=mesh(crystal,new THREE.TorusGeometry(.255,.009,6,48),mint,0,0,0,false);halo.rotation.x=.52;
const orbLight=new THREE.PointLight('#c6ff00',2.6,2.6);crystal.add(orbLight);
const flecks=[];const fleckMat=new THREE.MeshBasicMaterial({color:'#e1ff7c',transparent:true,opacity:.0,depthWrite:false});
for(let i=0;i<7;i++)flecks.push(mesh(scene,sphere(.018,8,6),fleckMat,0,-20,0,false));
function localFromWorld(point){return point.clone().sub(hero.position).applyAxisAngle(v(0,1,0),-hero.rotation.y);}
const gripOffset=v(.225,.03,0);
function update(tt){
 const t=Math.min(5,Math.max(0,Number(tt)||0));
 const walk=1-ease(1.34,1.63,t);
 hero.position.set(bodyWorldX(t),walk*.018*Math.sin(t*18),0);
 const excitement=ease(3.83,4.18,t)*(1-ease(4.66,4.95,t));
 hero.rotation.set(-.024*ease(2.05,2.85,t)+.09*excitement,.47*(1-ease(1.10,1.85,t))+.10*ease(4.42,5,t),.012*walk*Math.sin(t*9));
 for(const L of legs)poseLeg(L,t);
 const notice=ease(1.47,1.94,t);
 const focus=ease(1.95,2.22,t)*(1-ease(3.8,4.14,t));
 head.rotation.y=.25*focus-.16*ease(4.12,4.65,t);
 head.rotation.x=.14*focus-.10*excitement;
 head.rotation.z=.13*(ease(1.73,2.04,t)-ease(2.22,2.53,t))+.045*Math.sin(t*2.7);
 const widen=ease(3.88,4.15,t)*(1-ease(4.7,4.98,t));
 const blink=Math.exp(-Math.pow((t-1.75)/.055,2))+.75*Math.exp(-Math.pow((t-3.40)/.055,2));
 eyes.forEach((e)=>{e.scale.set(1+.20*widen,Math.max(.11,1+.35*widen-.93*blink),1);});
 brows.forEach((b,i)=>{b.position.y=.194+.043*widen;b.rotation.z=(i===0?-.12:.12)*(1+1.3*widen);});
 oh.visible=widen>.28;smile.visible=!oh.visible;
 head.position.y=1.98+.016*Math.sin(t*3.4)+.045*widen;
 // 0-1.4 WALK, 1.5-2.0 LOOK, 2.0-3.18 REACH, 3.18 CONTACT, 3.22-4.00 LIFT, 4-5 REACT.
 const reach=ease(2.02,3.18,t),lift=ease(3.22,3.98,t),grip=ease(3.10,3.30,t);
 const orbLocal=localFromWorld(orbStand);
 const contact=orbLocal.clone().sub(gripOffset); // palm touches the *side*, never the center
 const idle=v(.70,1.10,.20),show=v(.63,1.57,.40);
 let rightHand=mv(idle,contact,reach);
 rightHand.lerp(show,lift);
 const leftHand=mv(v(-.70,1.10,.20),v(-.61,1.54,.34),excitement);
 poseArm(arms[1],rightHand,grip);
 poseArm(arms[0],leftHand,0);
 if(t<3.22){crystal.position.copy(orbStand);}else{
   crystal.position.copy(hero.localToWorld(rightHand.clone().add(gripOffset)));
 }
 crystal.rotation.set(.05+.08*Math.min(t,3.22),.16*Math.min(t,3.22),.025*Math.sin(Math.min(t,3.22)*2));
 const magic=ease(3.92,4.30,t);
 const pulse=1+(.11*magic)*Math.sin(13*(t-3.90));
 crystal.scale.setScalar(pulse);
 orbLight.intensity=2.6+3.2*magic;
 crystalMat.emissiveIntensity=1.35+1.5*magic;
 mint.emissiveIntensity=.16+.26*magic;
 core.scale.setScalar(1+.14*magic);
 for(let i=0;i<flecks.length;i++){
  const a=i*2.4+t*.7,rad=.31+.07*(i%3);
  flecks[i].position.copy(crystal.position).add(v(Math.cos(a)*rad,Math.sin(a*1.3)*rad,Math.sin(a)*rad));
  flecks[i].scale.setScalar(Math.max(.001,magic));
 }
 fleckMat.opacity=.73*magic;
 // All camera changes are smooth; the last shot deliberately stays on the action/face.
 const shots=[
   {t:0,p:v(2.5,2.95,7.5),f:v(-.42,1.18,.06)},
   {t:1.40,p:v(1.65,2.65,6.0),f:v(-.15,1.25,.09)},
   {t:2.26,p:v(1.62,2.52,5.32),f:v(.12,1.40,.10)},
   {t:3.24,p:v(2.25,2.58,5.1),f:v(.22,1.34,.15)},
   {t:4.10,p:v(1.25,2.55,5.0),f:v(.03,1.50,.20)},
   {t:5,p:v(-.45,2.48,5.4),f:v(-.08,1.49,.18)}
 ];
 let j=0;while(j<shots.length-2&&t>shots[j+1].t)j++;
 const a=shots[j],b=shots[j+1],u=ease(a.t,b.t,t);
 const cp=mv(a.p,b.p,u),look=mv(a.f,b.f,u);
 if(portrait)cp.z+=.18;
 camera.position.copy(cp);camera.lookAt(look);
 R.render(scene,camera);R.getContext().finish();
 return true;
}
window.renderAt=update;
window.storyDuration=5;
window.storyScenes=[
 {start:0,end:1.42,action:'Alternating planted footsteps, approaching pedestal'},
 {start:1.42,end:2.02,action:'Stops, shifts gaze and inspects crystal'},
 {start:2.02,end:3.22,action:'Arm IK reaches toward crystal, without teleporting crystal'},
 {start:3.22,end:3.98,action:'Right palm grips side of crystal, lifts it off plinth'},
 {start:3.98,end:5,action:'Glowing reaction: wide eyes, open mouth, backlean, final camera move'}
];
update(0);window.animationReady=true;
</script></body></html>
