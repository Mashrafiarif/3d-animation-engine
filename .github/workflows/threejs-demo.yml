name: Render Three.js Demo with Sound

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'Resolution (start with preview)'
        required: true
        type: choice
        default: preview
        options: [preview, hd, full, portrait-preview, portrait-hd, portrait-full]
      fps:
        description: 'Frames per second'
        required: true
        type: choice
        default: '24'
        options: ['24', '30', '60']
      seconds:
        description: 'Video duration'
        required: true
        type: choice
        default: '4'
        options: ['4', '8', '12']

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        working-directory: threejs-demo
        run: npm install --no-audit --no-fund
      - name: Install headless browser
        run: npx playwright install --with-deps --only-shell chromium
      - name: Render 3D frames, generate SFX, and encode MP4
        env:
          QUALITY: ${{ inputs.quality }}
          FPS: ${{ inputs.fps }}
          SECONDS: ${{ inputs.seconds }}
        shell: bash
        working-directory: threejs-demo
        run: |
          case "$QUALITY" in
            preview) W=640; H=360 ;;
            hd) W=1280; H=720 ;;
            full) W=1920; H=1080 ;;
            portrait-preview) W=360; H=640 ;;
            portrait-hd) W=720; H=1280 ;;
            portrait-full) W=1080; H=1920 ;;
            *) echo "Unknown quality"; exit 1 ;;
          esac
          node render.mjs --width "$W" --height "$H" --fps "$FPS" --seconds "$SECONDS"
          python3 sound.py "$SECONDS" output/sfx.wav
          if [[ -f narration.mp3 ]]; then
            ffmpeg -hide_banner -loglevel error -y \
              -framerate "$FPS" -i output/frame_%05d.png \
              -i output/sfx.wav -i narration.mp3 \
              -filter_complex '[1:a]volume=0.35[sfx];[2:a]volume=1.0[voice];[sfx][voice]amix=inputs=2:duration=longest:dropout_transition=0[a]' \
              -map 0:v -map '[a]' -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
              -c:a aac -b:a 160k -t "$SECONDS" -movflags +faststart output/animation.mp4
          else
            ffmpeg -hide_banner -loglevel error -y \
              -framerate "$FPS" -i output/frame_%05d.png \
              -i output/sfx.wav -map 0:v -map 1:a \
              -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
              -c:a aac -b:a 160k -t "$SECONDS" -movflags +faststart output/animation.mp4
          fi
          ffprobe -v error -show_entries format=duration -of default=nw=1 output/animation.mp4
      - name: Downloadable video and audio
        uses: actions/upload-artifact@v4
        with:
          name: threejs-demo-video-with-sound
          path: |
            threejs-demo/output/animation.mp4
            threejs-demo/output/sfx.wav
          retention-days: 3
          compression-level: 0
